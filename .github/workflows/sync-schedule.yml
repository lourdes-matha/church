name: Sync schedule now
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to update
        type: choice
        default: main
        options:
          - website-next-development
          - main
  push:
    branches: [website-next-development]
    paths:
      - scripts/sync_schedule.py
      - scripts/sync_events.py
      - events-managed.js
      - .github/workflows/sync-schedule.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: schedule-sync-${{ github.event.inputs.target_branch || github.ref_name }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - name: Test schedule validation
        run: python3 -m unittest discover -s tests -v
      - name: Check event date transitions
        if: env.TARGET_BRANCH == 'website-next-development'
        run: node tests/test_event_dates.cjs
      - name: Validate and download published sheet
        run: python3 scripts/sync_schedule.py
      - name: Install image optimiser for TEST events
        if: env.TARGET_BRANCH == 'website-next-development'
        run: python3 -m pip install 'Pillow>=11,<13'
      - name: Validate and sync TEST events
        if: env.TARGET_BRANCH == 'website-next-development'
        run: python3 scripts/sync_events.py
      - name: Commit published data only
        id: commit
        run: |
          git add -- schedule-data.json
          if [ "$TARGET_BRANCH" = "website-next-development" ]; then
            git add -- events-data.json events-data.js
            if [ -d images/events/managed ]; then
              git add -- images/events/managed
            fi
          fi
          if git diff --cached --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync published parish schedule and events"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request production Pages rebuild after a bot commit
        if: steps.commit.outputs.changed == 'true' && env.TARGET_BRANCH == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages/builds'
          request = urllib.request.Request(url, data=b'{}', method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json'
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Pages rebuild requested:', response.status)
          PYTHON
